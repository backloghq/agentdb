name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24, 25]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Coverage
        if: matrix.node-version == 25
        run: npm run test:coverage

      - name: Coverage summary
        if: matrix.node-version == 25
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Coverage | Covered / Total |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------:|----------------:|" >> $GITHUB_STEP_SUMMARY
          jq -r '.total | to_entries | .[] | "| \(.key) | \(.value.pct)% | \(.value.covered) / \(.value.total) |"' coverage/coverage-summary.json >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: matrix.node-version == 25
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  integration:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data --console-address ":9001"
          for i in $(seq 1 30); do
            if curl -fs http://localhost:9000/minio/health/live > /dev/null 2>&1; then break; fi
            sleep 1
          done

      - name: Create test bucket
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_REGION: us-east-1
        run: aws --endpoint-url http://localhost:9000 s3 mb s3://agentdb-test

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Integration tests (MinIO)
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_REGION: us-east-1
          S3_INTEGRATION: "1"
          S3_TEST_BUCKET: agentdb-test
          S3_TEST_ENDPOINT: http://localhost:9000
          S3_TEST_REGION: us-east-1
        run: npx vitest run tests/agentdb-s3-integration.test.ts

      - name: MinIO logs (on failure)
        if: failure()
        run: docker logs minio

  stress:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Stress
        run: STRESS=1 npx vitest run tests/stress.test.ts

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t agentdb:ci .

      - name: Verify Docker image starts
        run: |
          docker run -d --name agentdb-test -p 3000:3000 agentdb:ci
          sleep 2
          curl -sf http://localhost:3000/health | grep -q '"ok"'
          docker stop agentdb-test
          docker rm agentdb-test

      - name: Check image size
        run: docker images agentdb:ci --format '{{.Size}}'
